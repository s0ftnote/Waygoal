:1px solid var(--border);border-radius:10px;padding:3px}.zoom button{min-height:30px;border:0;padding:2px 8px}.zoom span{font-size:11px;width:34px;text-align:center}.legend{position:absolute;right:14px;bottom:17px;font-size:11px;color:var(--muted);background:#fffffff0;padding:5px 9px;border-radius:8px}.peek{position:absolute;right:16px;top:15px;width:min(340px,calc(100% - 32px));max-height:calc(100% - 72px);overflow:auto;background:white;border:1px solid var(--path);border-radius:16px;padding:16px;box-shadow:0 12px 35px #1d365a12;z-index:5}.peek header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.peek p{font-size:13px;white-space:pre-wrap;margin:10px 0}.peek .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.chat{min-width:0;display:flex;flex-direction:column;background:white;border-left:1px solid var(--border);position:relative;overflow:hidden}.chat-head{min-height:62px;padding:12px 18px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}.chat-head .title{flex:1}.chat-head h2{font-size:16px}.chat-head p{font-size:11px;color:var(--muted)}.history-shell{flex:1;min-height:0;position:relative;display:flex}#history{flex:1;min-width:0;overflow:auto;padding:18px 19px 25px;scrollbar-width:thin;overflow-anchor:auto}.turn{padding-bottom:26px;margin-bottom:22px;border-bottom:1px solid var(--border);scroll-margin-top:16px}.turn:last-child{border-bottom:0;margin-bottom:0}.turn.located{border-left:3px solid var(--accent);padding-left:12px;margin-left:-15px}.turn-label{font:11px/1.5 SFMono-Regular,monospace;color:var(--muted);margin-bottom:11px}.message{position:relative}.message p{white-space:pre-wrap;font-size:14px;line-height:1.85}.message.user{background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:18px}.message.assistant{padding:0 4px}.message-role{font-size:11px;color:var(--muted);margin-bottom:5px}.message:hover .message-actions,.message:focus-within .message-actions{opacity:1}.message-actions{opacity:0;display:flex;gap:6px;justify-content:flex-end;margin-top:8px}.message-actions button{font-size:11px;min-height:25px;padding:1px 6px;background:transparent;border:0;color:var(--muted)}.message-actions button:hover{background:var(--soft);color:var(--ink)}.history-note{padding:12px;background:var(--soft);font-size:12px;border-radius:10px;margin-bottom:18px;color:var(--muted)}#rail{width:39px;flex:none;border-left:1px solid var(--border);padding:14px 3px;display:flex;align-items:center;flex-direction:column;gap:6px;overflow:auto;background:var(--bg)}.rail-item{width:31px;min-height:42px;border:0;background:transparent;padding:3px;display:flex;flex-direction:column;align-items:center;gap:4px;font:10px/1.2 SFMono-Regular,monospace;color:var(--muted)}.rail-item:after{content:'';width:8px;height:8px;border-radius:2px;border:1px solid var(--path);background:#d7e5e160}.rail-item[aria-current=true]:after{background:var(--ink);border-color:var(--ink)}.rail-item:hover{background:var(--soft)}#quick-preview{position:absolute;right:43px;top:15px;max-width:270px;background:white;border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:0 8px 24px #1d365a10;z-index:5;pointer-events:none;font-size:12px}.composer-shell{border-top:1px solid var(--border);background:white;padding:12px 18px 14px;flex:none}.composer-box{border:1px solid var(--path);border-radius:14px;padding:10px 12px;background:white}.composer-box:focus-within{outline:1px solid var(--ink)}#composer{display:block;width:100%;min-height:66px;max-height:160px;resize:vertical;border:0;background:transparent;font-size:14px;line-height:1.65;outline:none}.composer-actions{display:flex;align-items:center;justify-content:space-between;gap:10px}.composer-actions .tip{font-size:11px}#send{min-height:33px;font-size:13px;padding:4px 15px}#refs-summary{font-size:12px;cursor:pointer;min-height:25px}#materials{max-height:220px;overflow:auto;margin-bottom:10px}#materials:empty{display:none}.ref-row{display:flex;gap:7px;align-items:center;padding:6px 0;font-size:12px}.ref-row select{border:1px solid var(--border);border-radius:7px;padding:4px;min-width:0;flex:1;background:white}.ref-row button{min-height:27px;padding:1px 7px}.ref-preview{font-size:12px;white-space:pre-wrap;background:var(--bg);padding:9px;border-radius:8px;margin:6px 0}.tree-popover{position:absolute;right:14px;top:62px;width:calc(100% - 28px);max-height:55%;overflow:auto;border:1px solid var(--path);border-radius:14px;background:white;padding:14px;z-index:7;box-shadow:0 12px 35px #1d365a15}.tree-popover h3{font-size:14px;margin-bottom:10px}.tree-choice{display:block;width:100%;text-align:left;margin:7px 0;font-size:13px}.tree-choice small{display:block;color:var(--muted);font-size:11px}.statusbar{padding:7px 18px;font-size:11px;min-height:31px;background:var(--soft);display:flex;gap:12px;border-top:1px solid var(--border)}#notice{flex:1}#state-summary{color:var(--muted)}.walk{padding:8px 18px;display:flex;align-items:center;gap:10px;background:white;flex-wrap:wrap;font-size:12px;border-top:1px solid var(--border)}.walk p{color:var(--muted);flex:1}#step-btn{font-size:12px;min-height:31px}.walk .tip{font-size:10px}[hidden]{display:none!important}

</style></head><body>
<header class="top"><div class="brand">Waygoal</div><div class="top-main"><h1>在右侧一直聊，画布随对话生长</h1><p class="intro">试一件事：连续发送、回看与定位时，能否保持同一个对话框和清楚的当前路径？</p></div><span class="badge">交互原型 · 模拟回复 · 刷新重置</span></header>
<main class="work"><section class="canvas-shell" aria-label="对话画布"><nav class="canvas-toolbar"><span class="name">文章探索</span><div class="seg"><button id="mode-browse" aria-pressed="true">浏览</button><button id="mode-ref" aria-pressed="false">引用连线</button><button id="mode-assoc" aria-pressed="false">仅作关联</button></div><button id="cancel-link" class="small" hidden>取消</button><button id="reset" class="small">重置</button></nav><div id="viewport"><div id="world"><svg id="wires" aria-hidden="true"><g id="edges"></g><path id="line-preview"/></svg><div id="cards"></div><div id="next-target"></div></div><div class="zoom"><button id="zoom-out" aria-label="缩小">−</button><span id="zoom-level"></span><button id="zoom-in" aria-label="放大">＋</button><button id="fit">看全图</button></div><span class="legend">实线：对话路径　虚线：引用　点线：关联</span><section id="peek" class="peek" hidden aria-label="其他路径预览"></section></div></section>
<aside class="chat" aria-label="持续对话"><header class="chat-head"><div class="title"><h2>文章探索</h2><p id="path-label"></p></div><button id="latest" class="small">回到最新</button><button id="tree-button" class="small" aria-expanded="false">Tree</button></header><div class="history-shell"><div id="history" tabindex="0" aria-label="当前路径的完整历史"></div><nav id="rail" aria-label="快捷节点导航"></nav><div id="quick-preview" hidden></div></div><form id="composer-form" class="composer-shell"><details id="refs-details" hidden><summary id="refs-summary"></summary><div id="materials"></div></details><div class="composer-box"><textarea id="composer" aria-label="继续对话" placeholder="继续聊…"></textarea><div class="composer-actions"><span class="tip" id="composer-hint">Enter 发送 · Shift Enter 换行</span><button class="primary" id="send" type="submit" disabled>发送</button></div></div></form><section id="tree-menu" class="tree-popover" hidden aria-label="选择对话路径"></section></aside></main>
<div class="statusbar" role="status"><span id="notice"></span><span id="state-summary"></span></div>
<section class="walk"><strong>试着走一遍</strong><div class="seg" id="scenarios"><button data-scenario="continuous" aria-pressed="true">连续聊天</button><button data-scenario="locate" aria-pressed="false">双向定位</button><button data-scenario="branch" aria-pressed="false">分叉与返回</button><button data-scenario="reference" aria-pressed="false">引用下一轮</button></div><p id="walk-text"></p><button id="step-btn"></button><span class="tip">切换演练重置样例</span></section>
<script>
// In-memory model of one session tree. Entries, not sessions, have parentId.
const Model=(()=>{
 const seed=()=>{const rounds=[
 {id:'r1',num:'01',x:100,y:45,user:'想写一篇文章：AI 会不会让人失去判断力？',answer:'先限定读者：普通职场人。\n\n文章需要具体工作场景，避免只讨论抽象的好坏。可以分别探索「依赖的风险」和「协作的方法」。',uid:'u1',aid:'a1',refs:[]},
 {id:'r2',num:'02',x:100,y:295,user:'先探讨依赖的风险，找一个具体反例。',answer:'把 AI 的分析直接当成结论，会跳过核对前提的过程。\n\n例如，销售预测看起来很完整，但样本只覆盖了老客户。真正需要判断的是：这份预测适不适用于新客户？',uid:'u2',aid:'a2',refs:[]},
 {id:'r3',num:'03',x:100,y:545,user:'这个例子可以。怎样让读者自己发现这个问题？',answer:'可以先给出预测结果，让读者做一次选择，再揭示样本来自哪里。\n\n读者经历一次「我遗漏了什么」，比直接告诉他要保持判断力更具体。',uid:'u3',aid:'a3',refs:[]},
 {id:'r4',num:'04',x:450,y:295,user:'换个角度：怎样与 AI 协作，又保留自己的判断？',answer:'先写下自己的判断，再让 AI 找反例。\n\n把分歧变成待核对的问题，最后由人决定采用什么。',uid:'u4',aid:'a4',refs:[]}
 ];const parents=[null,'a1','a2','a1'];const entries=rounds.flatMap((r,i)=>[{id:r.uid,parentId:parents[i],round:r.id,role:'你',text:r.user},{id:r.aid,parentId:r.uid,round:r.id,role:'Agent',text:r.answer}]);return{sessionId:'sample-session',rounds,entries,activeLeaf:'a3',selected:'r3',draft:'',refs:[],cursorKey:'a3',parked:{},branchFrom:null,serial:4,branchSerial:0,associations:[],mode:'browse',linkFrom:null,sent:0,notice:'一直在右侧输入即可；左侧随每一轮对话生长。'};};
 const get=(s,id)=>s.rounds.find(n=>n.id===id),entry=(s,id)=>s.entries.find(e=>e.id===id);
 const path=(s,leaf=s.activeLeaf)=>{const result=[];for(let cursor=entry(s,leaf);cursor;cursor=entry(s,cursor.parentId))result.unshift(cursor);return result;};
 const unique=items=>[...new Map(items.map(e=>[e.id,e])).values()];
 const context=(s,leaf)=>unique(path(s,leaf).flatMap(e=>[...(e.role==='你'?(get(s,e.round).materials||[]):[]),e]));
 const refEntries=(s,r)=>{const n=get(s,r.from);if(r.scope==='path')return context(s,n.aid);if(r.scope==='excerpt')return r.excerpt?[{id:n.aid+':quote:'+r.excerpt,round:n.id,role:'摘录',text:r.excerpt}]:[];return[s.entries.find(e=>e.id===n.uid),s.entries.find(e=>e.id===n.aid)].filter(e=>r.scope==='round'||(r.scope==='user'?e.role==='你':e.role==='Agent'));};
 const materials=s=>{const present=new Set(context(s,s.activeLeaf).map(e=>e.id));return unique(s.refs.flatMap(r=>refEntries(s,r))).filter(e=>!present.has(e.id));};
 const park=s=>{s.parked[s.cursorKey]={draft:s.draft,refs:s.refs};};
 const parentRound=(s,n)=>entry(s,entry(s,n.uid).parentId)?.round??null;
 function reduce(state,a){const s=structuredClone(state);const tell=t=>(s.notice=t,s);
 if(a.type==='draft'){s.draft=a.text;return s;}
 if(a.type==='select'){s.selected=a.id;return s;}
 if(a.type==='mode'){s.mode=a.mode;s.linkFrom=null;return tell(a.mode==='ref'?'把来源卡片连到「下一轮」，仍在右侧继续聊。':a.mode==='assoc'?'连接两张卡片标记有关；再次连接同一对可取消。':'点击卡片定位历史，右侧仍沿当前路径继续。');}
 if(a.type==='start'){s.linkFrom=a.id;return tell(s.mode==='ref'?'请选择「下一轮」作为引用目标。':'请选择另一张卡片。');}
 if(a.type==='cancel'){s.linkFrom=null;return s;}
 if(a.type==='connect'){const from=a.from||s.linkFrom;s.linkFrom=null;if(!get(s,from))return s;if(s.mode==='assoc'){if(!get(s,a.to)||from===a.to)return tell('请选择另一张已有卡片。');const i=s.associations.findIndex(e=>[e.from,e.to].includes(from)&&[e.from,e.to].includes(a.to));if(i<0)s.associations.push({from,to:a.to});else s.associations.splice(i,1);return tell(i<0?'已建立关联；对话路径和输入未改变。':'已取消关联。');}if(a.to!=='next')return tell('已发送的历史保持原样，请把引用连到「下一轮」。');if(!s.refs.some(r=>r.from===from))s.refs.push({from,scope:'round',excerpt:''});return tell('已加入 '+get(s,from).num+' 的引用；仍从当前路径继续。');}
 if(a.type==='scope'){const r=s.refs.find(r=>r.from===a.from);if(r){r.scope=a.scope;r.excerpt=a.excerpt??r.excerpt;}return s;}
 if(a.type==='remove'){s.refs=s.refs.filter(r=>r.from!==a.from);return tell('已移除下一轮的这处引用。');}
 if(a.type==='switch'||a.type==='fork'){const target=entry(s,a.entryId);if(!target)return s;park(s);s.activeLeaf=a.type==='fork'&&target.role==='你'?target.parentId:target.id;s.branchFrom=a.type==='fork'?target.id:null;s.branchSerial++;s.cursorKey=a.type==='fork'?'branch:'+target.id+':'+s.branchSerial:target.id;const saved=s.parked[s.cursorKey];s.draft=saved?.draft||(a.type==='fork'&&target.role==='你'?target.text:'');s.refs=saved?.refs||[];s.selected=target.round;s.linkFrom=null;return tell(a.type==='fork'?'已明确从 '+get(s,target.round).num+' 分叉，接下来仍在右侧一直聊。':'已切换路径；右侧显示这条路径的完整历史。');}
 if(a.type==='send'){const text=(a.text??s.draft).trim();if(!text)return s;const parent=entry(s,s.activeLeaf),p=parent?get(s,parent.round):null;s.serial++;const id='r'+s.serial,uid='u'+s.serial,aid='a'+s.serial;let x=p?p.x:100,y=p?p.y+250:45;while(s.rounds.some(n=>Math.abs(n.x-x)<270&&Math.abs(n.y-y)<220))x+=350;const material=materials(s);const answer='【模拟回复】\n\n这一轮已接在前面的讨论之后'+(material.length?'，并附上你选取的 '+material.length+' 条材料。':'。')+'你可以直接继续输入下一句，原型会在左边接着长出卡片。';const r={id,num:String(s.serial).padStart(2,'0'),x,y,user:text,answer,uid,aid,refs:structuredClone(s.refs),materials:material};s.rounds.push(r);s.entries.push({id:uid,parentId:s.activeLeaf,round:id,role:'你',text},{id:aid,parentId:uid,round:id,role:'Agent',text:answer});delete s.parked[s.cursorKey];s.activeLeaf=aid;s.cursorKey=aid;s.branchFrom=null;s.draft='';s.refs=[];s.selected=id;s.sent++;return tell('已模拟发送 '+r.num+'；输入框留在原处，可以接着聊。');}
 return s;}
 return{seed,get,entry,path,context,materials,refEntries,parentRound,reduce};
})();
</script>
<script>
let state=Model.seed(),camera={x:0,y:0,z:1},pointer=null,scenario='continuous',step=0,historySignature='',scrollLock=false;
const $=q=>document.querySelector(q),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const node=id=>Model.get(state,id),viewport=$('#viewport'),history=$('#history'),composer=$('#composer');
function activeRounds(){return [...new Set(Model.path(state).map(e=>e.round))];}
function draftPoint(){const e=Model.entry(state,state.activeLeaf),n=e?node(e.round):null;return{x:n?n.x:100,y:n?n.y+250:45};}
function dispatch(a){const oldLeaf=state.activeLeaf;state=Model.reduce(state,a);const changed=oldLeaf!==state.activeLeaf||a.type==='fork';render({historyChanged:changed,append:a.type==='send',composerChanged:changed||a.type==='draft'});if(a.type==='mode'&&a.mode==='ref')fit();return changed;}
function curve(a,b,vertical=false){if(vertical)return`M${a.x},${a.y} C${a.x},${a.y+65} ${b.x},${b.y-65} ${b.x},${b.y}`;const d=Math.max(60,Math.abs(a.x-b.x)*.45)*(b.x>=a.x?1:-1);return`M${a.x},${a.y} C${a.x+d},${a.y} ${b.x-d},${b.y} ${b.x},${b.y}`;}
function height(id){return document.querySelector(`.card[data-id="${id}"]`)?.offsetHeight||180;}
function drawEdges(){let html='';const active=new Set(activeRounds());function edge(from,to,type){const a=node(from);if(!a)return;const b=to==='next'?draftPoint():node(to);if(!b)return;const vertical=type===''&&a.x===b.x;const backwards=b.x<a.x;const start=vertical?{x:a.x+127,y:a.y+height(a.id)}:{x:a.x+(backwards?0:254),y:a.y+height(a.id)/2+10};const end=vertical?{x:b.x+127,y:b.y}:{x:b.x+(backwards?(to==='next'?190:254):0),y:b.y+(to==='next'?25:height(b.id)/2+10)};html+=`<path class="wire ${type} ${type===''&&active.has(to)?'active':''}" d="${curve(start,end,vertical)}"/>`;}
 state.rounds.forEach(n=>{const parent=Model.parentRound(state,n);if(parent)edge(parent,n.id,'');n.refs.forEach(r=>edge(r.from,n.id,'ref'));});state.refs.forEach(r=>edge(r.from,'next','ref'));state.associations.forEach(e=>edge(e.from,e.to,'assoc'));$('#edges').innerHTML=html;}
function renderCards(){const active=new Set(activeRounds());$('#cards').innerHTML=state.rounds.map(n=>`<article class="card ${active.has(n.id)?'':'off-path'} ${state.selected===n.id?'selected':''} ${state.linkFrom===n.id?'connecting':''}" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px" tabindex="0" aria-label="卡片 ${n.num}：${esc(n.user)}">${state.mode==='assoc'?`<button class="port in" data-target="${n.id}" aria-label="连接到 ${n.num}"></button>`:''}<div class="card-head">${n.num}</div><div class="card-body"><div class="question">${esc(n.user)}</div><div class="answer"><b>A</b><span>${esc(n.answer.replace(/\n\s*\n/g,'\n'))}</span></div></div>${state.mode!=='browse'?`<button class="port out" data-source="${n.id}" aria-label="从 ${n.num} 连线"></button>`:''}</article>`).join('');const p=draftPoint();$('#next-target').innerHTML=state.mode==='ref'||state.refs.length?`<div class="pending-target" data-next style="left:${p.x}px;top:${p.y}px"><button class="port in" data-target="next" aria-label="连接到下一轮"></button>下一轮${state.refs.length?' · 引用 '+state.refs.map(r=>node(r.from).num).join('、'):''}</div>`:'';drawEdges();}
function applyCamera(){$('#world').style.transform=`translate(${camera.x}px,${camera.y}px) scale(${camera.z})`;$('#zoom-level').textContent=Math.round(camera.z*100)+'%';}
function fit(){const pending=state.mode==='ref'||state.refs.length?draftPoint():{x:0,y:0};const maxX=Math.max(pending.x+200,...state.rounds.map(n=>n.x+275)),maxY=Math.max(pending.y+60,...state.rounds.map(n=>n.y+height(n.id)))+45;camera.z=Math.max(.18,Math.min(1,(viewport.clientWidth-45)/maxX,(viewport.clientHeight-50)/maxY));camera.x=(viewport.clientWidth-maxX*camera.z)/2;camera.y=(viewport.clientHeight-maxY*camera.z)/2+12;applyCamera();}
function focusNode(id){const n=node(id);camera.x=viewport.clientWidth/2-(n.x+127)*camera.z;camera.y=viewport.clientHeight/2-(n.y+height(id)/2)*camera.z;applyCamera();}
function revealNode(id){const n=node(id),left=n.x*camera.z+camera.x,top=n.y*camera.z+camera.y,w=254*camera.z,h=height(id)*camera.z;if(left<30)camera.x+=30-left;else if(left+w>viewport.clientWidth-30)camera.x-=left+w-viewport.clientWidth+30;if(top<20)camera.y+=20-top;else if(top+h>viewport.clientHeight-60)camera.y-=top+h-viewport.clientHeight+60;applyCamera();}
function zoom(f){const z=Math.max(.18,Math.min(1.7,camera.z*f)),cx=viewport.clientWidth/2,cy=viewport.clientHeight/2;camera.x=cx-(cx-camera.x)*z/camera.z;camera.y=cy-(cy-camera.y)*z/camera.z;camera.z=z;applyCamera();}
function turnMarkup(id,entries){const n=node(id);return`<section class="turn" data-turn="${id}"><div class="turn-label">${n.num}</div>${entries.map(e=>`<div class="message ${e.role==='你'?'user':'assistant'}" data-entry="${e.id}"><div class="message-role">${e.role==='你'?'你':'A'}</div><p>${esc(e.text)}</p><div class="message-actions"><button type="button" data-fork="${e.id}">${e.role==='你'?'修改这句并分叉':'从这里分叉'}</button><button type="button" data-card="${id}">定位卡片</button></div></div>`).join('')}${n.materials?.length?`<details><summary class="tip">引用了 ${n.refs.map(r=>node(r.from).num).join('、')}</summary>${n.materials.map(e=>`<p class="ref-preview">${esc(e.text)}</p>`).join('')}</details>`:''}</section>`;}
function syncHistory({append=false,force=false}={}){const entries=Model.path(state),ids=[...new Set(entries.map(e=>e.round))],signature=entries.map(e=>e.id).join(',');if(signature!==historySignature||force){if(append&&historySignature&&signature.startsWith(historySignature+',')){const existing=new Set([...history.querySelectorAll('[data-turn]')].map(el=>el.dataset.turn));ids.filter(id=>!existing.has(id)).forEach(id=>history.insertAdjacentHTML('beforeend',turnMarkup(id,entries.filter(e=>e.round===id))));}else{history.innerHTML=ids.map(id=>turnMarkup(id,entries.filter(e=>e.round===id))).join('')||'<p class="history-note">从这里开始一条新的路径。发送后，左侧会出现新的卡片。</p>';}
 historySignature=signature;$('#rail').innerHTML=ids.map(id=>`<button class="rail-item" data-rail="${id}" aria-label="定位第 ${node(id).num} 轮与卡片" aria-current="${state.selected===id}">${node(id).num}</button>`).join('');}
 highlight();}
function highlight(){document.querySelectorAll('.turn').forEach(el=>el.classList.toggle('located',el.dataset.turn===state.selected));document.querySelectorAll('[data-rail]').forEach(el=>el.setAttribute('aria-current',el.dataset.rail===state.selected));document.querySelectorAll('.card').forEach(el=>el.classList.toggle('selected',el.dataset.id===state.selected));}
function scrollToRound(id){const el=history.querySelector(`[data-turn="${id}"]`);if(!el)return;scrollLock=true;history.scrollTop+=el.getBoundingClientRect().top-history.getBoundingClientRect().top-16;setTimeout(()=>scrollLock=false,100);}
function latest(){scrollLock=true;history.scrollTop=history.scrollHeight;state=Model.reduce(state,{type:'select',id:Model.entry(state,state.activeLeaf)?.round||state.selected});highlight();revealNode(state.selected);setTimeout(()=>scrollLock=false,100);status();}
function locate(id,{fromRail=false}={}){state=Model.reduce(state,{type:'select',id});highlight();if(activeRounds().includes(id)){$('#peek').hidden=true;scrollToRound(id);}else showPeek(id);if(fromRail)focusNode(id);status();}
function showPeek(id){const n=node(id);$('#peek').innerHTML=`<header><strong style="font-size:13px">${n.num} · 另一条路径</strong><button class="small" data-close-peek aria-label="关闭预览">×</button></header><p><strong>${esc(n.user)}</strong></p><p>${esc(n.answer)}</p><div class="actions"><button class="primary small" data-switch="${n.aid}">切换到这条路径</button><button class="small" data-fork="${n.aid}">从这里分叉</button><button class="small" data-reference="${id}">引用到下一轮</button></div><p class="tip">右侧仍沿当前路径继续。</p>`;$('#peek').hidden=false;}
function renderMaterials(){const refs=state.refs;$('#refs-details').hidden=!refs.length;$('#refs-summary').textContent=`下一轮引用 ${refs.map(r=>node(r.from).num).join('、')} · 查看范围`;$('#materials').innerHTML=refs.map(r=>{const n=node(r.from);return`<div class="ref-row"><strong>${n.num}</strong><select data-scope="${r.from}" aria-label="${n.num} 引用范围">${[['round','这一轮问答'],['answer','只引用回答'],['user','只引用用户消息'],['path','到这里的完整路径'],['excerpt','选择回答摘录']].map(([v,t])=>`<option value="${v}" ${r.scope===v?'selected':''}>${t}</option>`).join('')}</select><button type="button" data-remove="${r.from}" aria-label="移除 ${n.num} 引用">×</button></div>${r.scope==='excerpt'?`<p class="ref-preview" data-excerpt="${r.from}">${esc(n.answer)}</p><button type="button" class="small" data-pick="${r.from}">引用选中文字</button><p class="tip">已选：${esc(r.excerpt||'尚未选择')}</p>`:''}`;}).join('')+(refs.length?`<details><summary class="tip">实际附加 ${Model.materials(state).length} 条材料，当前历史中的消息不重复加入</summary>${Model.materials(state).map(e=>`<p class="ref-preview">${esc(e.text)}</p>`).join('')}</details>`:'');}
function renderTree(){const parents=new Set(state.entries.map(e=>e.parentId)),leaves=state.entries.filter(e=>!parents.has(e.id));$('#tree-menu').innerHTML=`<h3>选择要继续的路径</h3>${leaves.map(e=>`<button class="tree-choice" data-switch="${e.id}">${node(e.round).num} · ${esc(node(e.round).user)}${e.id===state.activeLeaf?' <span class="tip">当前</span>':''}<small>${[...new Set(Model.path(state,e.id).map(e=>node(e.round).num))].join(' → ')}</small></button>`).join('')}<p class="tip">选择后切换完整历史；各条路径的未发送输入分别保留。</p>`;}
function status(){$('#notice').textContent=state.notice;const active=Model.entry(state,state.activeLeaf);$('#state-summary').textContent=`当前路径 ${active?node(active.round).num:'起点'} · 定位 ${node(state.selected).num} · ${state.rounds.length} 张卡片 · 模拟发送 ${state.sent} 次`;$('#path-label').textContent=state.branchFrom?'从 '+node(Model.entry(state,state.branchFrom).round).num+' 分叉 · 发送后生长新路径':'当前路径 · '+activeRounds().map(id=>node(id).num).join(' → ');$('#composer-hint').textContent=state.branchFrom?'正在新分支继续 · Enter 发送':'Enter 发送 · Shift Enter 换行';$('#send').disabled=!composer.value.trim();}
function render({historyChanged=false,append=false,composerChanged=false}={}){renderCards();syncHistory({append,force:historyChanged&&!append});renderMaterials();renderTree();if(composerChanged)composer.value=state.draft;for(const mode of ['browse','ref','assoc'])$('#mode-'+mode).setAttribute('aria-pressed',state.mode===mode);$('#cancel-link').hidden=!state.linkFrom;status();renderWalk();applyCamera();}
function send(text){const content=(text??composer.value).trim();if(!content)return;dispatch({type:'send',text:content});$('#peek').hidden=true;latest();composer.focus({preventScroll:true});}
function changePath(entryId,fork=false){dispatch({type:fork?'fork':'switch',entryId});$('#tree-menu').hidden=true;$('#tree-button').setAttribute('aria-expanded','false');$('#peek').hidden=true;latest();composer.focus({preventScroll:true});}
const scenarios={continuous:{text:'同一个输入框连续发送，左侧逐轮生长。',steps:[['发送第一句',()=>send('先把这个例子展开成开头。')],['直接接着聊',()=>send('再加一个让读者参与的提问。')],['继续第三轮',()=>send('把语气改得更自然一些。')]]},locate:{text:'定位旧内容，输入和当前路径保持原样。',steps:[['写下一句，先不发',()=>{dispatch({type:'draft',text:'这句话还没写完，请保留。'});composer.focus();}],['左侧点 01',()=>locate('r1')],['右侧快捷定位 02',()=>locate('r2',{fromRail:true})],['回到最新，继续输入',()=>{latest();composer.focus();}]]},branch:{text:'明确分叉才换路线，原路径留在 Tree 中。',steps:[['从 02 回答分叉',()=>changePath('a2',true)],['在新路径聊一句',()=>send('如果换成科研场景呢？')],['继续聊下一句',()=>send('举一个文献综述的例子。')],['切回原路径 03',()=>changePath('a3')]]},reference:{text:'把支线材料接到下一轮，仍用同一个输入框。',steps:[['预览另一条路径 04',()=>locate('r4')],['引用 04 到下一轮',()=>{dispatch({type:'mode',mode:'ref'});dispatch({type:'connect',from:'r4',to:'next'});$('#refs-details').open=true;}],['只引用回答',()=>dispatch({type:'scope',from:'r4',scope:'answer'})],['在原路径继续聊',()=>send('结合这个协作方法，完善刚才的文章开头。')]]}};
function renderWalk(){document.querySelectorAll('[data-scenario]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.scenario===scenario));const sc=scenarios[scenario];$('#walk-text').textContent=sc.text;$('#step-btn').textContent=step<sc.steps.length?`${step+1}/${sc.steps.length} ${sc.steps[step][0]}`:'重新演练';}
function initialView(){fit();if(viewport.clientWidth<600){camera.z=.85;focusNode(state.selected);}}
function reset(){state=Model.seed();step=0;historySignature='';composer.value='';$('#peek').hidden=true;$('#tree-menu').hidden=true;$('#refs-details').open=false;render({historyChanged:true});initialView();latest();}
$('#composer-form').onsubmit=e=>{e.preventDefault();send();};composer.oninput=()=>{state=Model.reduce(state,{type:'draft',text:composer.value});$('#send').disabled=!composer.value.trim();};composer.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send();}};
$('#latest').onclick=latest;$('#tree-button').onclick=()=>{const open=$('#tree-menu').hidden;$('#tree-menu').hidden=!open;$('#tree-button').setAttribute('aria-expanded',String(open));};$('#reset').onclick=reset;$('#fit').onclick=fit;$('#zoom-in').onclick=()=>zoom(1.2);$('#zoom-out').onclick=()=>zoom(1/1.2);for(const mode of ['browse','ref','assoc'])$('#mode-'+mode).onclick=()=>dispatch({type:'mode',mode});$('#cancel-link').onclick=()=>dispatch({type:'cancel'});$('#scenarios').onclick=e=>{const b=e.target.closest('[data-scenario]');if(b){scenario=b.dataset.scenario;reset();}};$('#step-btn').onclick=()=>{const sc=scenarios[scenario];if(step>=sc.steps.length){reset();return;}sc.steps[step][1]();step++;renderWalk();};
$('#materials').onchange=e=>{if(e.target.dataset.scope)dispatch({type:'scope',from:e.target.dataset.scope,scope:e.target.value});};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b){if(b.dataset.rail){locate(b.dataset.rail,{fromRail:true});return;}if(b.dataset.card){locate(b.dataset.card,{fromRail:true});return;}if(b.dataset.closePeek!==undefined){$('#peek').hidden=true;return;}if(b.dataset.fork){changePath(b.dataset.fork,true);return;}if(b.dataset.switch){changePath(b.dataset.switch);return;}if(b.dataset.reference){dispatch({type:'mode',mode:'ref'});dispatch({type:'connect',from:b.dataset.reference,to:'next'});$('#refs-details').open=true;return;}if(b.dataset.source&&e.detail===0){dispatch({type:'start',id:b.dataset.source});return;}if(b.dataset.target&&state.linkFrom){dispatch({type:'connect',to:b.dataset.target});return;}if(b.dataset.remove){dispatch({type:'remove',from:b.dataset.remove});return;}if(b.dataset.pick){const sel=getSelection(),el=document.querySelector(`[data-excerpt="${b.dataset.pick}"]`),text=sel?.toString().trim();if(text&&el.contains(sel.anchorNode)&&el.contains(sel.focusNode))dispatch({type:'scope',from:b.dataset.pick,scope:'excerpt',excerpt:text});return;}}
 const card=e.target.closest('.card');if(card&&!b&&!pointer?.moved){if(state.linkFrom)dispatch({type:'connect',to:card.dataset.id});else locate(card.dataset.id);}else if(e.target.closest('[data-next]')&&!b){if(state.linkFrom)dispatch({type:'connect',to:'next'});else composer.focus({preventScroll:true});}
});
$('#rail').addEventListener('pointerover',e=>{const b=e.target.closest('[data-rail]');if(!b)return;const n=node(b.dataset.rail),preview=$('#quick-preview');preview.innerHTML=`<strong>${n.num} · ${esc(n.user)}</strong><p class="tip" style="margin-top:6px">A　${esc(n.answer.split('\n')[0])}</p>`;preview.style.top=Math.min(b.offsetTop,Math.max(15,$('.history-shell').clientHeight-150))+'px';preview.hidden=false;});$('#rail').onpointerleave=()=>$('#quick-preview').hidden=true;
let scrollFrame=0;history.addEventListener('scroll',()=>{if(scrollFrame)return;scrollFrame=requestAnimationFrame(()=>{scrollFrame=0;if(scrollLock||!$('#peek').hidden)return;const top=history.getBoundingClientRect().top+45,turns=[...history.querySelectorAll('[data-turn]')];if(!turns.length)return;const nearest=turns.reduce((a,b)=>Math.abs(a.getBoundingClientRect().top-top)<Math.abs(b.getBoundingClientRect().top-top)?a:b);state=Model.reduce(state,{type:'select',id:nearest.dataset.turn});highlight();status();});});
viewport.addEventListener('pointerdown',e=>{if(e.button!==0)return;const source=e.target.closest('[data-source]'),head=e.target.closest('.card-head');if(source){e.preventDefault();dispatch({type:'start',id:source.dataset.source});pointer={type:'line',id:source.dataset.source,sx:e.clientX,sy:e.clientY,moved:false};return;}if(head){const n=node(head.closest('.card').dataset.id);pointer={type:'node',id:n.id,sx:e.clientX,sy:e.clientY,x:n.x,y:n.y,moved:false};return;}if(e.target.closest('button,.card,.zoom,.peek,[data-next]'))return;pointer={type:'pan',sx:e.clientX,sy:e.clientY,x:camera.x,y:camera.y,moved:false};viewport.classList.add('panning');});
window.addEventListener('pointermove',e=>{if(!pointer)return;const dx=e.clientX-pointer.sx,dy=e.clientY-pointer.sy;pointer.moved ||= Math.abs(dx)+Math.abs(dy)>5;if(pointer.type==='node'){const n=node(pointer.id);n.x=Math.max(0,pointer.x+dx/camera.z);n.y=Math.max(20,pointer.y+dy/camera.z);const el=document.querySelector(`.card[data-id="${n.id}"]`);el.style.left=n.x+'px';el.style.top=n.y+'px';const p=draftPoint(),target=$('[data-next]');if(target){target.style.left=p.x+'px';target.style.top=p.y+'px';}drawEdges();}else if(pointer.type==='pan'){camera.x=pointer.x+dx;camera.y=pointer.y+dy;applyCamera();}else{const rect=viewport.getBoundingClientRect(),n=node(pointer.id);$('#line-preview').setAttribute('d',curve({x:n.x+254,y:n.y+height(n.id)/2+10},{x:(e.clientX-rect.left-camera.x)/camera.z,y:(e.clientY-rect.top-camera.y)/camera.z}));}});
window.addEventListener('pointerup',e=>{if(!pointer)return;const p=pointer;if(p.type==='line'&&p.moved){const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-next],.card');if(target)dispatch({type:'connect',from:p.id,to:target.dataset.next!==undefined?'next':target.dataset.id});else dispatch({type:'cancel'});}$('#line-preview').setAttribute('d','');viewport.classList.remove('panning');setTimeout(()=>pointer=null,0);});window.addEventListener('pointercancel',()=>{pointer=null;$('#line-preview').setAttribute('d','');viewport.classList.remove('panning');dispatch({type:'cancel'});});viewport.addEventListener('wheel',e=>{if(e.target.closest('.peek'))return;e.preventDefault();if(e.ctrlKey||e.metaKey)zoom(e.deltaY>0?.92:1.08);else{camera.x-=e.deltaX;camera.y-=e.deltaY;applyCamera();}},{passive:false});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){dispatch({type:'cancel'});$('#peek').hidden=true;$('#tree-menu').hidden=true;}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card')){e.preventDefault();if(state.linkFrom)dispatch({type:'connect',to:e.target.dataset.id});else locate(e.target.dataset.id);}});window.addEventListener('resize',initialView);render();requestAnimationFrame(()=>{initialView();latest();});
</script></body></html>
