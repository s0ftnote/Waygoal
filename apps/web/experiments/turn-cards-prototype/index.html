adius:9px;font-size:11px;pointer-events:none}.legend span:before{content:'';display:inline-block;width:20px;border-top:2px solid var(--path);vertical-align:middle;margin-right:5px}.legend .ref:before{border-top-style:dashed}.legend .assoc:before{border-top-style:dotted}.zoom{position:absolute;left:16px;top:14px;display:flex;align-items:center;gap:4px;background:#ffffffed;border:1px solid var(--border);border-radius:10px;padding:3px}.zoom button{min-height:32px;border:0;padding:2px 10px}.zoom span{font-size:12px;width:40px;text-align:center}.hint{position:absolute;right:14px;bottom:14px;font-size:11px;color:var(--muted);background:#ffffffed;padding:8px;border-radius:9px;max-width:220px}.inspector{overflow:auto;background:white;padding:20px;border-left:1px solid var(--border)}.inspector .overline{font-size:12px;color:var(--muted);margin-bottom:5px}.inspector h2{margin-bottom:14px}.section{margin:18px 0}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.msg{padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:12px;margin-bottom:10px}.msg p{font-size:14px;white-space:pre-wrap;margin:5px 0 10px}.msg-label{font-size:12px;color:var(--muted)}.ref-item{border:1px solid var(--border);border-radius:12px;padding:10px;margin:9px 0}.ref-item header{display:flex;align-items:center;gap:6px;font-size:13px}.ref-item header strong{flex:1}.ref-item select{margin:8px 0 4px;width:100%;padding:7px;border:1px solid var(--path);border-radius:8px;background:white;font-size:13px}.ref-item textarea{min-height:70px;margin:5px 0}.tip{font-size:12px;line-height:1.6;color:var(--muted)}textarea{width:100%;min-height:105px;padding:10px;border:1px solid var(--path);border-radius:10px;resize:vertical;background:white;font-size:14px;line-height:1.6}label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}.send{width:100%;margin-top:10px}.empty{padding:14px;border:1px dashed var(--path);border-radius:10px;background:var(-- </style></head><body>
<header class="top"><div class="wordmark">Waygoal</div><div class="top-main"><h1>让对话在画布上展开</h1><p class="intro">试一件事：从一轮问答分叉，再把不同卡片连到下一段讨论，能否清楚掌握来路与材料？</p></div><span class="badge">可操作原型 · 模拟回复 · 刷新重置</span></header>
<nav class="toolbar" aria-label="画布操作"><div class="seg" aria-label="连线用途"><button id="mode-ref" aria-pressed="true">引用并继续</button><button id="mode-assoc" aria-pressed="false">仅作关联</button></div><span class="tip" id="mode-tip">从卡片右侧圆点，连到待发送卡片左侧</span><div class="spacer"></div><button id="new-draft">＋ 新讨论</button><button id="cancel-link" hidden>取消连线</button><button id="reset">重置样例</button></nav>
<main class="work"><div id="viewport" aria-label="可拖动、缩放及连线的对话画布"><div id="world"><div class="flow-title">文章探索 / 怎样让 AI 帮助人保持判断力</div><svg id="wires" aria-hidden="true"><g id="edges"></g><path id="preview"/></svg><div id="cards"></div></div><div class="zoom"><button id="zoom-out" aria-label="缩小">−</button><span id="zoom-level"></span><button id="zoom-in" aria-label="放大">＋</button><button id="fit">看全图</button></div><div class="legend"><span>分叉来源</span><span class="ref">引用材料</span><span class="assoc">仅作关联</span></div><div class="hint">拖卡片标题移动 · 拖空白平移<br>圆点可拖线，也可依次点击两端</div></div><aside class="inspector" id="inspector" aria-label="查看原文与准备下一轮"></aside></main>
<div class="statusbar" role="status"><span id="notice"></span><span id="state-summary"></span></div>
<section class="walk" aria-label="引导演练"><strong>试着走一遍</strong><div class="seg" id="scenarios"><button data-scenario="combine" aria-pressed="true">组合两轮</button><button data-scenario="branch" aria-pressed="false">从原话分叉</button><button data-scenario="boundary" aria-pressed="false">连线边界</button></div><p id="walk-text"></p><button id="step-btn"></button><span class="tip">切换演练会重置样例</span></section>
<script>
// Portable in-memory model. No Pi, network, storage or DOM access in this module.
const Model=(()=>{
 const seed=()=>({nodes:[
  {id:'n1',num:'01',session:'原讨论',x:70,y:200,user:'想写一篇文章：AI 会不会让人失去判断力？',answer:'先限定读者：普通职场人。\n文章需要具体工作场景，避免只讨论抽象的好坏。\n可以分别探索「依赖的风险」和「协作的方法」。',entries:['u1','a1'],status:'sent',base:[],refs:[]},
  {id:'n2',num:'02',session:'风险支线',x:440,y:60,user:'先探讨依赖的风险，找一个具体反例。',answer:'把 AI 的分析直接当成结论，会跳过核对前提的过程。\n例子：用一份销售预测替代自己对样本偏差的判断。',entries:['u2','a2'],status:'sent',parent:'n1',cut:'answer',base:[],refs:[]},
  {id:'n3',num:'03',session:'方法支线',x:440,y:400,user:'换个角度：怎样与 AI 协作，又保留自己的判断？',answer:'先写下自己的判断，再让 AI 找反例。\n把分歧变成待核对的问题，最后由人决定采用什么。',entries:['u3','a3'],status:'sent',parent:'n1',cut:'answer',base:[],refs:[]},
  {id:'n4',num:'04',session:'新讨论',x:830,y:230,user:'结合两条思路，帮我形成文章提纲。',answer:'',entries:[],status:'draft',base:[],refs:[]}
 ],associations:[],selected:'n4',active:'n3',mode:'ref',linkFrom:null,serial:4,sent:0,notice:'把 02、03 右侧的圆点连到 04，再检查材料。'});
 const get=(s,id)=>s.nodes.find(n=>n.id===id);
 const own=(n)=>[{id:n.entries[0],node:n.id,role:'你',text:n.user},{id:n.entries[1],node:n.id,role:'Agent',text:n.answer}].filter(e=>e.id);
 const unique=(items)=>[...new Map(items.map(e=>[e.id,e])).values()];
 const path=(s,n)=>n.sentMaterials?unique([...n.sentMaterials,...own(n)]):unique([...(n.base||[]),...(n.parent?path(s,get(s,n.parent)).filter(e=>n.cut!=='user'||e.id!==get(s,n.parent).entries[1]):[]),...own(n)]);
 const refEntries=(s,r)=>{const n=get(s,r.from);if(r.scope==='path')return path(s,n);if(r.scope==='excerpt')return r.excerpt.trim()?[{id:n.id+':excerpt:'+r.excerpt,node:n.id,role:'摘录',text:r.excerpt}]:[];return own(n).filter(e=>r.scope==='round'||(r.scope==='user'?e.role==='你':e.role==='Agent'));};
 const materials=(s,n)=>unique([...(n.base||[]),...n.refs.flatMap(r=>refEntries(s,r))]);
 function reduce(state,a){const s=structuredClone(state);const n=get(s,a.id||s.selected);const tell=t=>(s.notice=t,s);
  if(a.type==='select'){s.selected=a.id;return tell('正在查看 '+n.num+'；继续位置没有改变。');}
  if(a.type==='mode'){s.mode=a.mode;s.linkFrom=null;return tell(a.mode==='ref'?'引用线将材料加入待发送讨论。':'关联线只表达有关，不加入发送材料。');}
  if(a.type==='start'){if(n.status==='draft')return tell('先发送这张卡片，再将其内容用于别处。');s.linkFrom=n.id;return tell('已选 '+n.num+' 为起点，请点另一张卡片或左侧圆点。');}
  if(a.type==='cancel'){s.linkFrom=null;return tell('已取消连线。');}
  if(a.type==='connect'){const from=get(s,a.from||s.linkFrom),to=get(s,a.to);s.linkFrom=null;if(!from||!to)return s;if(from.id===to.id)return tell('同一张卡片不需要连接自己。');if(s.mode==='assoc'){if(!s.associations.some(e=>[e.from,e.to].includes(from.id)&&[e.from,e.to].includes(to.id)))s.associations.push({from:from.id,to:to.id});s.selected=to.id;return tell('已建立关联；发送材料和原对话均未改变。');}if(to.status!=='draft')return tell('这轮已经发送，保留当时的材料。请连接到待发送卡片，或新开讨论。');if(from.status!=='sent')return tell('待发送卡片还没有可引用的回答。');if(!to.refs.some(r=>r.from===from.id))to.refs.push({from:from.id,scope:'round',excerpt:''});s.selected=to.id;return tell('已将 '+from.num+' 加入 '+to.num+' 的材料；尚未发送。');}
  if(a.type==='new'||a.type==='fork'){s.serial++;const parent=a.type==='fork'?n:null;const id='n'+s.serial;const lastDraft=s.nodes.filter(v=>v.status==='draft').length;const base=parent?path(s,parent).filter(e=>a.cut!=='user'||e.id!==parent.entries[1]):[];s.nodes.push({id,num:String(s.serial).padStart(2,'0'),session:parent?'来自 '+parent.num+' 的新支线':'新讨论',x:parent?parent.x+350:850+lastDraft*100,y:parent?parent.y+300:100+lastDraft*320,user:'',answer:'',entries:[],status:'draft',parent:parent?.id,cut:a.cut||'answer',base,refs:[]});s.selected=id;s.linkFrom=null;return tell(parent?'分叉草稿已准备，从 '+parent.num+' 的'+(a.cut==='user'?'用户消息':'回答')+'处接着想；发送后开始新支线。':'新讨论已准备，可连入材料或直接提问。');}
  if(a.type==='scope'){if(n.status!=='draft')return tell('这轮已经发送，引用范围保持固定。');const r=n.refs.find(r=>r.from===a.from);if(r){r.scope=a.scope;r.excerpt=a.excerpt??r.excerpt;}return tell('已调整引用范围；尚未发送。');}
  if(a.type==='remove'){if(n.status!=='draft')return tell('这轮已经发送，保留当时的引用。');n.refs=n.refs.filter(r=>r.from!==a.from);return tell('已移除这处引用；原卡片仍保留。');}
  if(a.type==='remove-assoc'){s.associations=s.associations.filter((_,i)=>i!==a.index);return tell('已取消关联。');}
  if(a.type==='prompt'){if(n.status!=='draft')return s;n.user=a.text;return s;}
  if(a.type==='move'){n.x=a.x;n.y=a.y;return s;}
  if(a.type==='send'){if(n.status!=='draft'||!n.user.trim())return tell('先写下这一轮想讨论的问题。');n.sentMaterials=materials(s,n);n.status='sent';n.entries=['u'+s.serial+'-'+n.id,'a'+s.serial+'-'+n.id];n.answer='【模拟回复】\n这轮已保留你的问题和 '+n.sentMaterials.length+' 条材料。\n真实接入后，Agent 会在这里回答。你可以继续从这张卡片分叉。';s.active=n.id;s.sent++;return tell('已模拟发送 '+n.num+'；所用材料已固定，原有讨论保持原样。');}
  return s;
 }
 return{seed,get,own,path,materials,reduce};
})();
</script>
<script>
let state=Model.seed(),camera={x:0,y:0,z:1},scenario='combine',step=0;let pointer=null;
const $=q=>document.querySelector(q),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const node=id=>Model.get(state,id),viewport=$('#viewport');
function dispatch(a){state=Model.reduce(state,a);render();}
function curve(x1,y1,x2,y2){const d=Math.max(55,Math.abs(x2-x1)*.45);return `M${x1},${y1} C${x1+d},${y1} ${x2-d},${y2} ${x2},${y2}`;}
function position(id,side){const n=node(id),el=document.querySelector(`.card[data-id="${id}"]`);return{x:n.x+(side==='out'?258:0),y:n.y+(el?.offsetHeight||240)*.48+11};}
function drawEdges(){let h='';function edge(from,to,type,label){const a=position(from,'out'),b=position(to,'in');h+=`<path class="wire ${type}" d="${curve(a.x,a.y,b.x,b.y)}"/><text class="edge-label" x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2-9}" text-anchor="middle">${label}</text>`;}state.nodes.forEach(n=>{if(n.parent)edge(n.parent,n.id,'','分叉');n.refs.forEach(r=>edge(r.from,n.id,'ref','引用'));});state.associations.forEach(e=>edge(e.from,e.to,'assoc','有关'));$('#edges').innerHTML=h;}
function applyCamera(){$('#world').style.transform=`translate(${camera.x}px,${camera.y}px) scale(${camera.z})`;$('#zoom-level').textContent=Math.round(camera.z*100)+'%';}
function fit(){const maxX=Math.max(...state.nodes.map(n=>n.x+285)),maxY=Math.max(...state.nodes.map(n=>n.y+(document.querySelector(`.card[data-id="${n.id}"]`)?.offsetHeight||250)))+50;camera.z=Math.min(1,(viewport.clientWidth-60)/maxX,(viewport.clientHeight-65)/maxY);camera.z=Math.max(.23,camera.z);camera.x=(viewport.clientWidth-maxX*camera.z)/2;camera.y=(viewport.clientHeight-maxY*camera.z)/2+20;applyCamera();}
function zoom(factor){const next=Math.max(.2,Math.min(1.8,camera.z*factor)),cx=viewport.clientWidth/2,cy=viewport.clientHeight/2;camera.x=cx-(cx-camera.x)*next/camera.z;camera.y=cy-(cy-camera.y)*next/camera.z;camera.z=next;applyCamera();}
function focusNode(id){const n=node(id);camera.x=viewport.clientWidth/2-(n.x+129)*camera.z;camera.y=viewport.clientHeight/2-(n.y+130)*camera.z;applyCamera();}
function renderCards(){$('#cards').innerHTML=state.nodes.map(n=>{
 const draft=n.status==='draft';
 const materials=[n.parent?'从 '+node(n.parent).num+' 分出':'',n.refs.length?'引用 '+n.refs.map(r=>node(r.from).num).join('、'):''].filter(Boolean).join(' · ');
 return `<article class="card ${draft?'draft':''} ${state.selected===n.id?'selected':''} ${state.linkFrom===n.id?'connecting':''}" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px" tabindex="0" aria-label="${n.num} ${esc(n.session)}"><button class="port in" data-target="${n.id}" aria-label="连接到 ${n.num}" title="连接到这里"></button><div class="card-head"><span class="num">${n.num}</span><strong style="font-size:13px">${esc(n.session)}</strong>${draft?'<span class="tag">待发送</span>':''}</div><div class="card-body"><div class="prompt">${esc(n.user||'想从这里继续探讨什么？')}</div>${draft?(materials?`<div class="answer">${esc(materials)}</div>`:''):`<div class="answer"><b>A</b><div class="answer-text">${esc(n.answer)}</div></div>`}</div>${!draft?`<button class="port out" data-source="${n.id}" aria-label="从 ${n.num} 连线" title="拖动或点击，再选择目标"></button>`:''}</article>`;
 }).join('');drawEdges();}
function materialHtml(entries){return entries.length?entries.map(e=>`<div class="material"><strong>${node(e.node)?.num||''} · ${esc(e.role)}</strong>${esc(e.text)}</div>`).join(''):'<p class="tip">没有附加材料，可从新问题开始。</p>';}
function renderInspector(){const n=node(state.selected),entries=n.status==='draft'?Model.materials(state,n):(n.sentMaterials||[]);let h=`<div class="overline">${n.status==='draft'?'准备下一轮':'只读查看'} · ${n.num}</div><h2>${esc(n.session)}</h2>`;
 if(n.status==='draft'){
 h+=n.parent?`<div class="empty">从 ${node(n.parent).num} 的${n.cut==='user'?'用户消息':'回答'}分出，继承 ${n.base.length} 条消息。<br><button class="small back-source" data-view="${n.parent}">回看来源</button></div>`:'';
 h+=`<div class="section"><div class="section-head"><h3>这轮引用的材料</h3><span class="chip">${n.refs.length} 处</span></div>${n.refs.length?'':'<div class="empty">将卡片右侧圆点连到这张卡片。也可以先点起点圆点，再点目标卡片。</div>'}`;
 h+=n.refs.map(r=>{const source=node(r.from);return `<div class="ref-item"><header><strong>${source.num} · ${esc(source.session)}</strong><button class="small" data-view="${source.id}">原文</button><button class="small" data-remove="${source.id}" aria-label="移除 ${source.num} 的引用">×</button></header><select data-scope="${source.id}" aria-label="${source.num} 的引用范围">${[['round','这一轮提问与回答'],['answer','只引用回答'],['user','只引用用户消息'],['path','到这里的完整路径'],['excerpt','选择回答中的摘录']].map(([v,t])=>`<option value="${v}" ${r.scope===v?'selected':''}>${t}</option>`).join('')}</select>${r.scope==='excerpt'?`<p class="tip">从下方回答选取一段，再点「引用选中文字」。</p><p data-excerpt-source="${source.id}" style="font-size:13px;white-space:pre-wrap;margin:6px 0">${esc(source.answer)}</p><button class="small" data-pick-excerpt="${source.id}">引用选中文字</button><div class="scope-meta">已选：${esc(r.excerpt||'尚未选择，本处暂不加入材料')}</div>`:''}<div class="scope-meta">${r.scope==='path'?'包含来源路径，共同消息按身份去重。':'范围限于所选内容；没有默默带上其他支线。'}</div></div>`;}).join('');
 h+=`</div><details open><summary>查看发送材料 · ${entries.length} 条（共同消息已去重）</summary>${materialHtml(entries)}</details><div class="section"><label for="prompt-input">这次想继续探讨什么？</label><textarea id="prompt-input" placeholder="写下新问题…">${esc(n.user)}</textarea><button class="primary send" id="send" ${!n.user.trim()?'disabled':''}>发送并继续 · 模拟</button><p class="tip" style="margin-top:7px">此页不连接模型。发送会固定本轮材料，生成一张模拟回答卡片。</p></div>`;
 }else{
 h+=`<div class="msg"><div class="msg-label">你 · 用户消息</div><p>${esc(n.user)}</p><button class="small" data-fork="${n.id}" data-cut="user">从这条消息分叉</button></div><div class="msg"><div class="msg-label">A · Agent 回答</div><p>${esc(n.answer)}</p><button class="small" data-fork="${n.id}" data-cut="answer">从这条回答分叉</button></div><div class="inspect-actions"><button class="primary" data-start="${n.id}">从这张卡片连线</button>${n.parent?`<button data-view="${n.parent}">回看来源 ${node(n.parent).num}</button>`:''}</div><p class="tip" style="margin-top:9px">${n.sentMaterials?'这一轮的材料已固定；需要改变输入时，从这里分叉或新开讨论。':'这是样例原文。展开、移动和回看不改变继续位置。'}</p>${n.sentMaterials?`<details><summary>这轮实际使用的材料 · ${entries.length} 条</summary>${materialHtml(entries)}</details>`:''}`;
 }
 const associated=state.associations.map((e,i)=>({...e,index:i})).filter(e=>e.from===n.id||e.to===n.id);if(associated.length)h+=`<div class="section"><h3>仅作关联 · 不参与发送</h3>${associated.map(e=>`<div class="ref-item">与 ${node(e.from===n.id?e.to:e.from).num} 有关 <button class="small" data-remove-assoc="${e.index}">取消关联</button></div>`).join('')}</div>`;
 const drafts=state.nodes.filter(v=>v.status==='draft'&&v.id!==n.id);if(drafts.length)h+=`<div class="section"><h3>待发送讨论</h3><div class="inspect-actions" style="margin-top:8px">${drafts.map(v=>`<button class="small" data-view="${v.id}">回到 ${v.num} · ${esc(v.session)}</button>`).join('')}</div></div>`;
 $('#inspector').innerHTML=h;
}
function render(){renderCards();renderInspector();$('#notice').textContent=state.notice;$('#state-summary').textContent=`查看 ${node(state.selected).num} · 继续位置 ${node(state.active).num} · ${state.nodes.filter(n=>n.status==='draft').length} 个草稿 · 模拟发送 ${state.sent} 次`;$('#mode-ref').setAttribute('aria-pressed',state.mode==='ref');$('#mode-assoc').setAttribute('aria-pressed',state.mode==='assoc');$('#mode-tip').textContent=state.linkFrom?'连线中：请选择另一张卡片；Esc 取消':state.mode==='ref'?'从卡片右侧圆点，连到待发送卡片左侧':'连接两张卡片，仅标记「有关」';$('#cancel-link').hidden=!state.linkFrom;renderWalk();applyCamera();}
const scenarios={combine:{text:'把两张卡片引用到 04，查看范围后发送。',steps:[['连入 02',()=>dispatch({type:'connect',from:'n2',to:'n4'})],['连入 03',()=>dispatch({type:'connect',from:'n3',to:'n4'})],['只引用两处回答',()=>{dispatch({type:'scope',id:'n4',from:'n2',scope:'answer'});dispatch({type:'scope',id:'n4',from:'n3',scope:'answer'});}],['发送组合讨论',()=>dispatch({type:'send',id:'n4'})]]},branch:{text:'从 01 的用户消息分叉，观察原回答是否被排除。',steps:[['从 01 用户消息分叉',()=>{dispatch({type:'fork',id:'n1',cut:'user'});fit();}],['写一个不同的问题',()=>dispatch({type:'prompt',text:'先不讨论风险，文章的读者真正想解决什么问题？'})],['发送这条支线',()=>dispatch({type:'send'})],['只回看原讨论',()=>dispatch({type:'select',id:'n1'})]]},boundary:{text:'关联不送入上下文；已发送的输入保持固定。',steps:[['仅关联 02 与 03',()=>{dispatch({type:'mode',mode:'assoc'});dispatch({type:'connect',from:'n2',to:'n3'});}],['尝试向已发送的 03 引用',()=>{dispatch({type:'mode',mode:'ref'});dispatch({type:'connect',from:'n2',to:'n3'});}],['改为引用到待发送的 04',()=>dispatch({type:'connect',from:'n2',to:'n4'})],['移除引用',()=>dispatch({type:'remove',id:'n4',from:'n2'})]]}};
function renderWalk(){document.querySelectorAll('[data-scenario]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.scenario===scenario));const sc=scenarios[scenario];$('#walk-text').textContent=sc.text;$('#step-btn').textContent=step<sc.steps.length?`${step+1}/${sc.steps.length} ${sc.steps[step][0]}`:'重新演练';}
function reset(){state=Model.seed();step=0;render();fit();}
$('#mode-ref').onclick=()=>dispatch({type:'mode',mode:'ref'});$('#mode-assoc').onclick=()=>dispatch({type:'mode',mode:'assoc'});$('#cancel-link').onclick=()=>dispatch({type:'cancel'});$('#new-draft').onclick=()=>{dispatch({type:'new'});fit();};$('#reset').onclick=reset;$('#zoom-in').onclick=()=>zoom(1.2);$('#zoom-out').onclick=()=>zoom(1/1.2);$('#fit').onclick=fit;$('#step-btn').onclick=()=>{const sc=scenarios[scenario];if(step>=sc.steps.length){reset();return;}sc.steps[step][1]();step++;renderWalk();};$('#scenarios').onclick=e=>{const b=e.target.closest('[data-scenario]');if(b){scenario=b.dataset.scenario;reset();}};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b){if(b.dataset.source&&e.detail===0){dispatch({type:'start',id:b.dataset.source});return;}if(b.dataset.fork){dispatch({type:'fork',id:b.dataset.fork,cut:b.dataset.cut||'answer'});fit();return;}if(b.dataset.view){dispatch({type:'select',id:b.dataset.view});focusNode(b.dataset.view);return;}if(b.dataset.start){dispatch({type:'start',id:b.dataset.start});return;}if(b.dataset.target&&state.linkFrom){dispatch({type:'connect',to:b.dataset.target});return;}if(b.dataset.remove){dispatch({type:'remove',from:b.dataset.remove});return;}if(b.dataset.removeAssoc!==undefined){dispatch({type:'remove-assoc',index:Number(b.dataset.removeAssoc)});return;}if(b.dataset.pickExcerpt){const selection=getSelection(),source=document.querySelector(`[data-excerpt-source="${b.dataset.pickExcerpt}"]`),text=selection?.toString().trim();if(text&&source.contains(selection.anchorNode)&&source.contains(selection.focusNode))dispatch({type:'scope',from:b.dataset.pickExcerpt,scope:'excerpt',excerpt:text});else{$('#notice').textContent='先在这处回答里选中要引用的文字。';}return;}if(b.id==='send'){dispatch({type:'send'});return;}}
 const card=e.target.closest('.card');if(card&&!b&&!pointer?.moved){if(state.linkFrom&&state.linkFrom!==card.dataset.id)dispatch({type:'connect',to:card.dataset.id});else dispatch({type:'select',id:card.dataset.id});}
});
$('#inspector').addEventListener('change',e=>{if(e.target.dataset.scope)dispatch({type:'scope',from:e.target.dataset.scope,scope:e.target.value});});$('#inspector').addEventListener('input',e=>{if(e.target.id==='prompt-input'){state=Model.reduce(state,{type:'prompt',text:e.target.value});$('#send').disabled=!e.target.value.trim();const card=document.querySelector(`.card[data-id="${state.selected}"] .prompt`);card.textContent=e.target.value||'想从这里继续探讨什么？';drawEdges();}});
viewport.addEventListener('pointerdown',e=>{if(e.button!==0)return;const source=e.target.closest('[data-source]'),head=e.target.closest('.card-head');if(source){e.preventDefault();dispatch({type:'start',id:source.dataset.source});pointer={type:'line',id:source.dataset.source,sx:e.clientX,sy:e.clientY,moved:false};return;}if(head){const n=node(head.closest('.card').dataset.id);pointer={type:'node',id:n.id,sx:e.clientX,sy:e.clientY,x:n.x,y:n.y,moved:false};return;}if(e.target.closest('button,.card,.zoom'))return;pointer={type:'pan',sx:e.clientX,sy:e.clientY,x:camera.x,y:camera.y,moved:false};viewport.classList.add('panning');});
window.addEventListener('pointermove',e=>{if(!pointer)return;const dx=e.clientX-pointer.sx,dy=e.clientY-pointer.sy;pointer.moved ||= Math.abs(dx)+Math.abs(dy)>5;if(pointer.type==='node'){const n=node(pointer.id);n.x=Math.max(0,pointer.x+dx/camera.z);n.y=Math.max(35,pointer.y+dy/camera.z);const el=document.querySelector(`.card[data-id="${n.id}"]`);el.style.left=n.x+'px';el.style.top=n.y+'px';drawEdges();}else if(pointer.type==='pan'){camera.x=pointer.x+dx;camera.y=pointer.y+dy;applyCamera();}else{const rect=viewport.getBoundingClientRect(),a=position(pointer.id,'out');$('#preview').setAttribute('d',curve(a.x,a.y,(e.clientX-rect.left-camera.x)/camera.z,(e.clientY-rect.top-camera.y)/camera.z));}});
window.addEventListener('pointerup',e=>{if(!pointer)return;const p=pointer;if(p.type==='line'&&p.moved){const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.card');if(target&&target.dataset.id!==p.id)dispatch({type:'connect',from:p.id,to:target.dataset.id});else dispatch({type:'cancel'});}$('#preview').setAttribute('d','');viewport.classList.remove('panning');setTimeout(()=>pointer=null,0);});
window.addEventListener('pointercancel',()=>{pointer=null;$('#preview').setAttribute('d','');viewport.classList.remove('panning');dispatch({type:'cancel'});});viewport.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey||e.metaKey){zoom(e.deltaY>0?.92:1.08);}else{camera.x-=e.deltaX;camera.y-=e.deltaY;applyCamera();}},{passive:false});window.addEventListener('keydown',e=>{if(e.key==='Escape')dispatch({type:'cancel'});if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card')){e.preventDefault();const id=e.target.dataset.id;if(state.linkFrom&&state.linkFrom!==id)dispatch({type:'connect',to:id});else dispatch({type:'select',id});}});function initialView(){fit();if(viewport.clientWidth<650){camera.z=.85;focusNode(state.selected);}}window.addEventListener('resize',initialView);render();requestAnimationFrame(initialView);
</script></body></html>
