<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waygoal · 票据通知实验</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{background:#14241f;color:#f3eedf;font:15px/1.7 system-ui,sans-serif;margin:0}main{max-width:1150px;margin:auto;padding:36px 24px}h1{font-size:30px;font-weight:500}h2{font-size:18px}p{color:#b6beaf}.flow{border:1px solid #52614e;padding:16px;border-radius:12px;color:#e6d9a8}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin:24px 0}.node{border:1px solid #425348;border-radius:12px;padding:20px;background:#1d3028;min-width:0}.deleted{opacity:.6}.pill{display:inline-block;border:1px solid #607056;border-radius:20px;padding:2px 10px;font-size:12px}.locator{font-size:12px;overflow-wrap:anywhere;color:#b6beaf}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 system-ui,sans-serif;max-height:230px;overflow:auto}summary{cursor:pointer}a{color:#e6d9a8}.log{padding:8px 0;border-bottom:1px solid #425348;font-size:13px}small{color:#b6beaf}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style>
<main><small>WAYGOAL / 一次真实通知实验</small><h1>票据在哪里，都通知同一张画布。</h1><p>本地票据由 Luna 实际写入后通知；GitHub 是公开工单的只读快照；自定义 tracker 是虚构格式样本。页面接收内容，不登录任何 tracker。</p><div class="flow">Agent 操作或读取来源 → 调用同一个通知工具 → 本地 Web 更新节点</div><div id="status"></div><div class="grid" id="nodes"></div><h2>实际收到的变化</h2><div id="log"></div><p>这是独立实验接收端，尚未接入原来的无限画布。状态保存在本次进程内；删除保留记录。页面每秒读取接收端状态。</p></main>
<script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const labels={open:'未完成',claimed:'进行中',resolved:'已解决',cancelled:'已取消',deleted:'来源已删除'};async function render(){try{const s=await(await fetch('/state')).json();document.getElementById('status').innerHTML=`<p>${s.nodes.filter(n=>n.status!=='deleted').length} 个当前节点 · ${s.nodes.filter(n=>n.status==='deleted').length} 条删除记录</p>`;document.getElementById('nodes').innerHTML=s.nodes.map(n=>`<section class="node ${n.status==='deleted'?'deleted':''}"><small>${esc(n.source)}</small><h2>${esc(n.title)}</h2><span class="pill">${labels[n.status]}</span><p>${n.blockers===undefined?'依赖未核对':n.blockers.length?'依赖：'+n.blockers.map(k=>{const b=s.nodes.find(x=>x.sourceKey===k);return esc(b?.title||k)+'（'+(b?labels[b.status]:'未接收')+'）'}).join('、'):'没有前置依赖'}</p><div class="locator">${esc(n.locator)}</div><p>${esc(n.answer||'')}</p><details><summary>查看收到的票据正文</summary><pre>${esc(n.body)}</pre></details><small>同一身份已接收 ${n.deliveries} 次更新</small></section>`).join('');document.getElementById('log').innerHTML=s.log.slice().reverse().map(e=>`<div class="log">${esc(e.action)}${e.title?' · '+esc(e.title):''}</div>`).join('')}catch{document.getElementById('status').textContent='接收服务暂不可用'}}render();setInterval(render,1000)</script></html>
