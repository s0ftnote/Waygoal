 if(ticket){const chats=owned(id),status=id==='t12'?(state.resolved?'✓ 已解决':'○ 待解决'):(state.resolved?'○ 可推进':'等待 #12');return `<article class="${cls}" data-node="${id}" style="left:${p.x}px;top:${p.y}px" aria-label="票据：${esc(title(id))}"><button class="ticket-open" data-ticket-open="${id}"><span class="meta"><span>${id==='t12'?'#12 · grilling':'#13 · research'}</span><b>${status}</b></span><strong>${esc(title(id))}</strong><p>${chats.length?`${chats.length} 段讨论${chats.some(c=>c.id===state.active)?' · 有当前继续的会话':''}`:'还没有会话 · 可以从这里开始'}</p></button><div class="ticket-actions"><button class="button primary" data-talk="${id}">${chats.length?'继续讨论 ↗':'开始讨论 ＋'}</button>${chats.length?`<button class="fold" data-fold="${id}">${state.expanded[id]?'收进票里 ↑':'展开会话 ↓'}</button>`:'<span class="subtle card-badge">点开看原文</span>'}</div></article>`}
 return `<button class="${cls}" data-node="${id}" aria-label="会话：${esc(s.title)}" aria-pressed="${state.view===id}" style="left:${p.x}px;top:${p.y}px"><span class="meta"><span>${s.parent?'↳ 分支会话':'◌ 会话'}</span><b>${state.view===id?'正在查看':s.parent?'来自 '+esc(title(s.parent)):s.ticket?'讨论起点':'独立起点'}</b></span><strong>${esc(s.title)}</strong><p>${esc(s.preview)}</p>${s.ticket?`<span class="session-owner">#${s.ticket.slice(1)} · ${esc(title(s.ticket))} 下的讨论</span>`:''}</button>`;
}
function edge(a,b,type='branch'){if(!layout[a]||!layout[b])return '';const p=layout[a],q=layout[b];let d;
 if(type==='mount'){const x=p.x+32,y=p.y+p.h,ex=q.x+32,ey=q.y;d=`M${x} ${y} C${x} ${y+35} ${ex} ${ey-35} ${ex} ${ey}`}
 else {const x=p.x+p.w,y=p.y+67,ex=q.x,ey=q.y+67,m=(x+ex)/2;d=`M${x} ${y} C${m} ${y} ${m} ${ey} ${ex} ${ey}`}
 return `<path marker-end="${type==='dependency'?'url(#dep-arrow)':''}" class="edge ${type} ${state.view===b?'route':''}" d="${d}"/>`;
}
function paths(){let out='';state.sessions.filter(s=>s.parent).forEach(s=>out+=edge(s.parent,s.id));if(state.tickets){out+=edge('t12','t13','dependency');state.sessions.filter(s=>s.ticket&&!s.parent).forEach(s=>out+=edge(s.ticket,s.id,'mount'));if(layout.t12&&layout.t13){const p=layout.t12,q=layout.t13;out+=`<text class="edge-label" x="${(p.x+p.w+q.x)/2}" y="${p.y+54}" text-anchor="middle">#12 解决后可推进 →</text>`}}return out}

 if(state.tickets){html+=card('t12',80,145);html+=card('t13',770,145);for(const tid of ['t12','t13']){if(!state.expanded[tid])continue;const all=owned(tid),base=tid==='t12'?80:770;let roots=all.filter(c=>!c.parent);roots.forEach((c,i)=>html+=card(c.id,base,420+i*200));all.filter(c=>c.parent).forEach((c,i)=>html+=card(c.id,base+350,420+i*200));}}
 else {html+=card('root',80,175);state.sessions.filter(c=>c.parent).forEach((c,i)=>html+=card(c.id,420,175+i*200));}
 state.sessions.filter(c=>!c.ticket&&c.id!=='root').forEach((c,i)=>html+=card(c.id,state.tickets?(owned('t13').some(s=>s.parent)?1510:1140):850,175+i*235));

 $('#orientation').innerHTML=`<div class="floating-note"><span>${state.tickets?'周末聚会 · 票据地图':'你的会话空间'}</span><p>${state.tickets?'点票就能聊，会话留在票下面。':'每个想法，都可以是一个独立起点。'}</p></div>`;$('#orientation').hidden=state.panel;$('#dep-legend').hidden=!state.tickets;$('#mount-legend').hidden=!state.tickets;
 wireCards();document.querySelectorAll('[data-talk]').forEach(b=>b.onclick=e=>{e.stopPropagation();talk(b.dataset.talk)});document.querySelectorAll('[data-ticket-open]').forEach(b=>b.onclick=e=>{e.stopPropagation();openNode(b.dataset.ticketOpen)});document.querySelectorAll('[data-fold]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.fold;state.expanded[id]=!state.expanded[id];render();tell(state.expanded[id]?'会话已展开在票下，继续位置没有变化。':'会话已收进票里；仍可从票据继续讨论。')});renderPanel();updateState();transform();newNode=null;flash=false;
}
function talk(tid){const chats=owned(tid);if(chats.length){const last=state.last[tid];if(last&&session(last)){state.active=last;openNode(last);tell('继续这张票上次的讨论；其他分支没有合并进来。')}else openNode(tid);return}
 const id='session'+Date.now();state.sessions.push({id,title:title(tid)+'的讨论',parent:null,origin:null,ticket:tid,preview:'已准备票据引用，等你发送。',messages:[]});state.drafts[id]='/skill:wayfinder #'+tid.slice(1);state.last[tid]=id;state.active=id;state.expanded[tid]=true;newNode=id;openNode(id);tell('已在票下建立样例会话。命令放在输入框里，尚未发送。');}

function renderPanel(){const panel=$('#panel');panel.hidden=!state.panel;if(!state.panel)return;const id=state.view,s=session(id),ticket=isTicket(id),active=id===state.active;
 panel.innerHTML=`<div class="panel-head"><div class="row"><span class="tag">${ticket?'票据 · 虚构样例':active?'继续位置 · 等待输入':'只读回看'}</span><button class="icon" id="close-panel" aria-label="关闭详情">×</button></div>${!ticket&&s.ticket?`<button class="panel-ticket-link" data-open="${s.ticket}">← #${s.ticket.slice(1)} ${esc(title(s.ticket))}</button>`:''}<h2>${esc(title(id))}</h2><div class="context">${ticket?'票据下面可以开始、继续或回看讨论':s.parent?'来自「'+esc(title(s.parent))+'」的一条消息':s.ticket?'这段会话属于票据 #'+s.ticket.slice(1):'独立会话 · 无关联票据'}</div></div><div class="scroll">${ticket?ticketContent(id):chatContent(s)}</div><div class="panel-bottom">${ticket?`<button class="button primary" id="ticket-talk">${owned(id).length?'继续上次讨论 ↗':'开始讨论 ＋'}</button><small>由你进入会话；查看票据不会自动发送消息。</small>`:active?`<textarea id="draft" aria-label="写一条样例消息" placeholder="在这里继续想法…（仅本地演示）">${esc(state.drafts[id]||'')}</textarea><div class="row"><button class="button primary" id="send">发送（样例）<span class="circle">↑</span></button><button class="button" id="rename">改名</button></div><small>${s.ticket&&!s.messages.length?'命令仅作演示，点击发送才会加入样例聊天。':'无模型连接；不会生成 Agent 回复。'}</small>`:`<div class="row"><button class="button primary" id="continue">从这里继续 <span class="circle">↗</span></button><button class="button" id="rename">改名</button></div><small>只读回看；继续位置仍是「${esc(title(state.active))}」。</small>`}</div>`;
 $('#close-panel').onclick=()=>{state.panel=false;render();tell('关闭详情，继续位置与票据状态保持不变。')};panel.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openNode(b.dataset.open));panel.querySelectorAll('[data-fork]').forEach(b=>b.onclick=()=>forkDialog(id,b.dataset.fork));$('#ticket-talk')?.addEventListener('click',()=>talk(id));$('#start-empty')?.addEventListener('click',()=>talk(id));$('#continue')?.addEventListener('click',()=>{state.active=id;if(s.ticket)state.last[s.ticket]=id;render();tell('继续位置已切换，未自动带入其他分支的消息。')});$('#rename')?.addEventListener('click',()=>nameDialog('给这段会话改个名字',s.title,value=>{s.title=value;render();tell('名称已更新，票据归属与分叉来源不变。')}));$('#draft')?.addEventListener('input',e=>state.drafts[id]=e.target.value);$('#send')?.addEventListener('click',()=>{const text=$('#draft').value.trim();if(!text)return;s.messages.push({id:id+'-'+Date.now(),role:'你',text});s.preview=text;state.drafts[id]='';render();tell('消息已加入样例会话；没有实际执行 skill 或调用模型。');$('.scroll').scrollTop=$('.scroll').scrollHeight});$('#source-change')?.addEventListener('click',()=>{state.resolved=!state.resolved;flash=state.resolved;render();tell(state.resolved?'样例 #12 已解决，#13 可推进；没有自动开始聊天。':'样例 #12 重新打开，#13 恢复等待前提。')});}
function chatContent(s){return `${s.parent?`<button class="source-link" data-open="${s.parent}">↖ 回看来源 · ${esc(title(s.parent))}<br>从这条消息分出：${esc(session(s.parent).messages.find(m=>m.id===s.origin)?.text.slice(0,40)||'')}</button>`:''}${s.messages.length?'':s.ticket?'<div class="empty-ticket"><h3>从这张票开始聊。</h3><p>票据引用已经放进输入框。你可以修改，也可以直接发送。</p></div>':'<div class="empty-ticket"><h3>给这个想法一个开头。</h3><p>直接聊就好，不需要先有一张票。</p></div>'}${s.messages.map(m=>`<div class="speaker"><span class="avatar">${m.role==='你'?'你':'π'}</span>${m.role==='你'?'你':'Pi · 预写样例'}</div><p class="message ${m.role==='你'?'user':''}">${esc(m.text)}</p>${m.role==='你'?`<div class="fork-affordance"><button data-fork="${m.id}">${iconFork} 从这里分叉</button></div>`:''}`).join('')}`}
function ticketContent(id){const chats=owned(id);return `${chats.length?`<div class="chat-choice"><h3>这张票下的讨论 · ${chats.length}</h3>${chats.map(s=>`<button class="linked-chat" data-open="${s.id}"><div><strong>${s.parent?'↳ ':''}${esc(s.title)}</strong><small>${s.id===state.active?'当前继续位置':s.parent?'从「'+esc(title(s.parent))+'」分出':'讨论起点'}</small></div><span>↗</span></button>`).join('')}</div>`:'<div class="empty-ticket"><h3>这张票还没有会话</h3><p>从这里开始讨论，会话就留在这张票下面。</p><button class="button primary" id="start-empty">开始讨论 ＋</button></div>'}${id==='t13'&&!state.resolved?'<p class="context">等待 #12 的结论。你仍可以先聊、补充信息，开始聊天不会解除阻塞。</p>':''}<details class="ticket-detail" open><summary>票据原文 · 样例节选</summary><div class="ticket-body"><h3>Question</h3>${id==='t12'?'什么形式能让 8 位朋友自然参与？':'选定的活动形式对场地有什么要求？'}<h3>Context</h3>${id==='t12'?'部分参与者彼此不认识，希望有交流的空间。':'需要结合活动形式，核对空间与设备。'}<h3>${id==='t12'?'Done when':'Blocked by'}</h3>${id==='t12'?'明确一种形式，并说明选择依据。':'#12 · 确定活动形式'}${id==='t12'&&state.resolved?'<h3>Answer（模拟来源变更）</h3>先用轻量合作桌游暖场，再留出自由聊天。':''}</div><small class="subtle">虚构字段节选，不作为 Matt 票据格式规范。</small></details>${id==='t12'?`<div style="margin-top:25px"><button class="button outlined" id="source-change">${state.resolved?'模拟来源：重新打开':'模拟来源：已解决'}</button></div>`:''}`}
function nameDialog(heading,value,done){const d=$('#dialog');d.innerHTML=`<form><h2>${heading}</h2><input name="name" aria-label="名称" maxlength="55" value="${esc(value)}" required autocomplete="off"><div class="row"><button type="button" class="button" id="cancel">取消</button><button class="button primary" type="submit">确定</button></div></form>`;d.showModal();$('#cancel').onclick=()=>d.close();d.querySelector('form').onsubmit=e=>{e.preventDefault();const value=d.querySelector('input').value.trim();if(!value)return;d.close();done(value)}}
function forkDialog(id,origin){nameDialog('沿着哪个方向聊？',state.branches===0?'一起看一部电影':state.branches===1?'围着桌子玩点什么':'另一种可能',value=>{const source=session(id),idx=source.messages.findIndex(m=>m.id===origin),key='branch'+(++state.branches);state.sessions.push({id:key,title:value,parent:id,origin,ticket:source.ticket||null,preview:'从来源消息分出，接着探索这个方向。',messages:[...source.messages.slice(0,idx+1).map(m=>({...m}))]});state.view=key;state.active=key;state.panel=true;if(source.ticket){state.expanded[source.ticket]=true;state.last[source.ticket]=key}newNode=key;render();center(key);tell('已创建样例分支，保留分叉点之前的路径；没有创建新票据。')})}
function transform(){$('#world').style.transform=`translate(${camera.x}px,${camera.y}px) scale(${camera.z})`;mini()}
function fit(){const keys=Object.values(layout);if(!keys.length)return;const v=$('#viewport'),left=Math.min(...keys.map(p=>p.x))-35,top=Math.min(...keys.map(p=>p.y))-100,right=Math.max(...keys.map(p=>p.x+p.w))+40,bottom=Math.max(...keys.map(p=>p.y+p.h))+50;camera.z=Math.min(1,(v.clientWidth-60)/(right-left),(v.clientHeight-100)/(bottom-top));camera.z=Math.max(.2,camera.z);camera.x=(v.clientWidth-(right-left)*camera.z)/2-left*camera.z;camera.y=65-top*camera.z;transform()}

function wireCards(){document.querySelectorAll('[data-node]').forEach(el=>{el.onclick=()=>{if(!el.dataset.dragged)openNode(el.dataset.node);delete el.dataset.dragged};el.onpointerdown=e=>{if(e.button!==0||e.target.closest('.ticket-actions'))return;e.stopPropagation();const id=el.dataset.node,p=layout[id],start={x:e.clientX,y:e.clientY,px:p.x,py:p.y};el.setPointerCapture(e.pointerId);el.onpointermove=m=>{const dx=(m.clientX-start.x)/camera.z,dy=(m.clientY-start.y)/camera.z;if(Math.abs(dx)+Math.abs(dy)<5)return;el.dataset.dragged='1';state.positions[variant][id]={x:start.px+dx,y:start.py+dy};layout[id]={...p,...state.positions[variant][id]};el.style.left=layout[id].x+'px';el.style.top=layout[id].y+'px';document.querySelectorAll('.edges > path,.edges > text').forEach(p=>p.remove());$('.edges').insertAdjacentHTML('beforeend',paths());mini()};el.onpointerup=()=>{el.onpointermove=null;if(el.dataset.dragged){setTimeout(()=>{render();tell('位置已调整；会话来源和票据依赖没有改变。')},0)}}}})}
